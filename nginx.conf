user nginx;
worker_processes 1;
error_log /tmp/log/nginx/error.log warn;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/cache/nginx/client_temp;
    proxy_temp_path /tmp/cache/nginx/proxy_temp;
    fastcgi_temp_path /tmp/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/cache/nginx/uwsgi_temp;
    scgi_temp_path /tmp/cache/nginx/scgi_temp;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /sql/ {
            autoindex on;
        }

        location /client/ {
            autoindex on;
        }

        location /scripts/ {
            autoindex on;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
